<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欣雄天然氣股份有限公司 - 管線敷設長度管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-box { box-shadow: none !important; border: none !important; padding: 0 !important; }
      input { border: none !important; background: transparent !important; text-align: right; }
    }
    .official-table th, .official-table td {
      border: 1px solid #000;
      padding: 10px 14px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <div class="no-print bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold text-sm">圖資專用</span>
        <h1 class="text-lg font-bold text-slate-800">管線敷設統計與 Excel 匯出系統</h1>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="exportExcelCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm transition">
          📥 下載 Excel 表格 (.csv)
        </button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium">🖨️ 列印公開報表</button>
        <button onclick="exportJSON()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium">💾 備份 JSON</button>
        <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium cursor-pointer">
          📂 還原備份 <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)" />
        </label>
      </div>
    </div>

    <!-- 輸入區塊 -->
    <div class="print-box bg-white p-6 md:p-10 rounded-xl shadow-sm border border-slate-200">
      <div class="no-print mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <label class="font-bold text-blue-900">選擇登錄年月：</label>
          <span>民國</span>
          <input type="number" id="inputYear" value="115" onchange="onDateChange()" class="w-20 px-2 py-1 border rounded text-center font-bold bg-white" />
          <span>年</span>
          <select id="inputMonth" onchange="onDateChange()" class="px-3 py-1 border rounded font-bold bg-white">
            <option value="1">01</option><option value="2">02</option><option value="3">03</option>
            <option value="4">04</option><option value="5" selected>05</option><option value="6">06</option>
            <option value="7">07</option><option value="8">08</option><option value="9">09</option>
            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
          </select>
          <span>月</span>
        </div>
        <div id="autoFillHint" class="text-xs text-blue-700 font-medium">💡 輸入「上月累計」與「本月累計」，系統自動計算本月敷設與合計。</div>
      </div>

      <!-- 公開報表 -->
      <div class="max-w-3xl mx-auto">
        <h2 class="text-center text-xl md:text-2xl font-bold tracking-wider mb-2" style="font-family: 'DFKai-SB', '標楷體', serif;">
          <span id="titleYear">115</span> 年 <span id="titleMonth">05</span> 月 &nbsp; 欣雄天然氣股份有限公司管線敷設統計表
        </h2>
        <div class="text-right text-sm mb-2 font-medium" style="font-family: 'DFKai-SB', '標楷體', serif;">單位：公尺</div>

        <table class="official-table w-full border-collapse text-base" style="font-family: 'Times New Roman', 'DFKai-SB', '標楷體', serif;">
          <thead>
            <tr class="bg-slate-50">
              <th class="w-1/4"></th>
              <th class="w-1/4 text-center font-bold">上月累計長度</th>
              <th class="w-1/4 text-center font-bold">本月敷設長度</th>
              <th class="w-1/4 text-center font-bold">本月累計長度</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="text-center font-bold">高壓管線 (申報)</td>
              <td><input type="number" step="0.01" id="hp_prev" oninput="calculateAll()" class="w-full text-right bg-amber-50 px-2 py-1 outline-none font-mono" /></td>
              <td class="text-right font-mono font-bold bg-slate-50" id="hp_diff">0.00</td>
              <td><input type="number" step="0.01" id="hp_curr" oninput="calculateAll()" class="w-full text-right bg-blue-50 px-2 py-1 outline-none font-mono font-semibold" /></td>
            </tr>
            <tr>
              <td class="text-center font-bold">中壓管線</td>
              <td><input type="number" step="0.01" id="mp_prev" oninput="calculateAll()" class="w-full text-right bg-amber-50 px-2 py-1 outline-none font-mono" /></td>
              <td class="text-right font-mono bg-slate-50" id="mp_diff">0.00</td>
              <td><input type="number" step="0.01" id="mp_curr" oninput="calculateAll()" class="w-full text-right bg-blue-50 px-2 py-1 outline-none font-mono font-semibold" /></td>
            </tr>
            <tr>
              <td class="text-center font-bold">低壓管線</td>
              <td><input type="number" step="0.01" id="lp_prev" oninput="calculateAll()" class="w-full text-right bg-amber-50 px-2 py-1 outline-none font-mono" /></td>
              <td class="text-right font-mono bg-slate-50" id="lp_diff">0.00</td>
              <td><input type="number" step="0.01" id="lp_curr" oninput="calculateAll()" class="w-full text-right bg-blue-50 px-2 py-1 outline-none font-mono font-semibold" /></td>
            </tr>
            <tr class="font-bold bg-slate-100">
              <td class="text-center">合計</td>
              <td class="text-right font-mono" id="tot_prev">0.00</td>
              <td class="text-right font-mono" id="tot_diff">0.00</td>
              <td class="text-right font-mono" id="tot_curr">0.00</td>
            </tr>
          </tbody>
        </table>
        
        <div class="mt-6 flex justify-end no-print">
          <button onclick="saveRecord()" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-sm">✅ 儲存本月紀錄（永不覆蓋）</button>
        </div>
      </div>
    </div>

    <!-- 歷史與當年累計變化區 -->
    <div class="no-print bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800">📚 歷史紀錄與當年累計長度變化</h3>
        <select id="filterYear" onchange="renderHistory()" class="border rounded px-3 py-1 font-bold bg-slate-50">
          <option value="ALL">顯示全部年度</option>
        </select>
      </div>

      <!-- 當年累計變化總覽卡片 -->
      <div id="yearlySummaryBox" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-4">
        <h4 class="font-bold text-blue-900 mb-2" id="yearlySummaryTitle">當年累計長度變化總覽</h4>
        <div class="grid grid-cols-4 gap-2 text-center text-sm font-mono">
          <div class="bg-white p-2 rounded border">
            <div class="text-xs text-slate-500">高壓淨增加</div>
            <div id="sum_hp" class="font-bold text-blue-700">0.00</div>
          </div>
          <div class="bg-white p-2 rounded border">
            <div class="text-xs text-slate-500">中壓淨增加</div>
            <div id="sum_mp" class="font-bold text-blue-700">0.00</div>
          </div>
          <div class="bg-white p-2 rounded border">
            <div class="text-xs text-slate-500">低壓淨增加</div>
            <div id="sum_lp" class="font-bold text-blue-700">0.00</div>
          </div>
          <div class="bg-white p-2 rounded border">
            <div class="text-xs text-slate-500">合計淨增加</div>
            <div id="sum_tot" class="font-bold text-blue-900">0.00</div>
          </div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 border-b">
              <th class="p-2 text-left">年月</th>
              <th class="p-2 text-right">高壓累計(敷設)</th>
              <th class="p-2 text-right">中壓累計(敷設)</th>
              <th class="p-2 text-right">低壓累計(敷設)</th>
              <th class="p-2 text-right font-bold text-blue-700">合計累計(敷設)</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'hsin_hsiung_pipeline_records_v7';
    function getRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }
    function saveRecordsToStorage(records) {
      records.sort((a, b) => (a.year - b.year) || (a.month - b.month));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }
    function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function val(id) { return parseFloat(document.getElementById(id).value) || 0; }

    function calculateAll() {
      const hp_prev = val('hp_prev'), hp_curr = val('hp_curr');
      const mp_prev = val('mp_prev'), mp_curr = val('mp_curr');
      const lp_prev = val('lp_prev'), lp_curr = val('lp_curr');

      const hp_diff = hp_curr - hp_prev;
      const mp_diff = mp_curr - mp_prev;
      const lp_diff = lp_curr - lp_prev;

      document.getElementById('hp_diff').innerText = fmt(hp_diff);
      document.getElementById('mp_diff').innerText = fmt(mp_diff);
      document.getElementById('lp_diff').innerText = fmt(lp_diff);

      document.getElementById('tot_prev').innerText = fmt(hp_prev + mp_prev + lp_prev);
      document.getElementById('tot_diff').innerText = fmt(hp_diff + mp_diff + lp_diff);
      document.getElementById('tot_curr').innerText = fmt(hp_curr + mp_curr + lp_curr);
    }

    function onDateChange() {
      const y = parseInt(document.getElementById('inputYear').value) || 115;
      const m = parseInt(document.getElementById('inputMonth').value) || 1;
      document.getElementById('titleYear').innerText = y;
      document.getElementById('titleMonth').innerText = String(m).padStart(2, '0');
      const records = getRecords();
      const existing = records.find(r => r.year === y && r.month === m);
      if (existing) {
        loadRecordToForm(existing, false);
        return;
      }
      let py = y, pm = m - 1;
      if (pm === 0) { py = y - 1; pm = 12; }
      const prev = records.find(r => r.year === py && r.month === pm);
      if (prev) {
        document.getElementById('hp_prev').value = prev.hp_curr;
        document.getElementById('mp_prev').value = prev.mp_curr;
        document.getElementById('lp_prev').value = prev.lp_curr;
        document.getElementById('hp_curr').value = '';
        document.getElementById('mp_curr').value = '';
        document.getElementById('lp_curr').value = '';
      }
      calculateAll();
    }

    function saveRecord() {
      const y = parseInt(document.getElementById('inputYear').value);
      const m = parseInt(document.getElementById('inputMonth').value);
      const records = getRecords();
      const idx = records.findIndex(r => r.year === y && r.month === m);
      const rec = {
        year: y, month: m,
        hp_prev: val('hp_prev'), hp_curr: val('hp_curr'),
        mp_prev: val('mp_prev'), mp_curr: val('mp_curr'),
        lp_prev: val('lp_prev'), lp_curr: val('lp_curr')
      };
      if (idx !== -1) records[idx] = rec; else records.push(rec);
      saveRecordsToStorage(records);
      updateYearFilterOptions(y);
      renderHistory();
      alert(`✅ 民國 ${y} 年 ${m} 月紀錄儲存成功！`);
    }

    function loadRecordToForm(rec) {
      document.getElementById('inputYear').value = rec.year;
      document.getElementById('inputMonth').value = rec.month;
      document.getElementById('titleYear').innerText = rec.year;
      document.getElementById('titleMonth').innerText = String(m).padStart(2, '0');
      document.getElementById('hp_prev').value = rec.hp_prev;
      document.getElementById('hp_curr').value = rec.hp_curr;
      document.getElementById('mp_prev').value = rec.mp_prev;
      document.getElementById('mp_curr').value = rec.mp_curr;
      document.getElementById('lp_prev').value = rec.lp_prev;
      document.getElementById('lp_curr').value = rec.lp_curr;
      calculateAll();
    }

    function deleteRecord(y, m) {
      if (!confirm(`確定刪除民國 ${y} 年 ${m} 月嗎？`)) return;
      saveRecordsToStorage(getRecords().filter(r => !(r.year === y && r.month === m)));
      updateYearFilterOptions();
      renderHistory();
    }

    function updateYearFilterOptions(selY) {
      const records = getRecords();
      const years = [...new Set(records.map(r => r.year))].sort((a, b) => b - a);
      const select = document.getElementById('filterYear');
      const cur = selY || select.value;
      select.innerHTML = '<option value="ALL">顯示全部年度</option>';
      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y; opt.innerText = `民國 ${y} 年`;
        select.appendChild(opt);
      });
      if (years.includes(Number(cur))) select.value = cur;
    }

    function renderHistory() {
      const records = getRecords();
      const filterYear = document.getElementById('filterYear').value;
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';
      const filtered = filterYear === 'ALL' ? records : records.filter(r => r.year === Number(filterYear));

      const summaryBox = document.getElementById('yearlySummaryBox');
      if (filterYear !== 'ALL' && filtered.length > 0) {
        summaryBox.classList.remove('hidden');
        const first = filtered[0], last = filtered[filtered.length - 1];
        document.getElementById('yearlySummaryTitle').innerText = `📅 民國 ${filterYear} 年（${first.month}月 ～ ${last.month}月）當年累計長度變化`;
        
        const d_hp = last.hp_curr - first.hp_prev;
        const d_mp = last.mp_curr - first.mp_prev;
        const d_lp = last.lp_curr - first.lp_prev;
        const d_tot = d_hp + d_mp + d_lp;

        document.getElementById('sum_hp').innerText = (d_hp >= 0 ? '+' : '') + fmt(d_hp);
        document.getElementById('sum_mp').innerText = (d_mp >= 0 ? '+' : '') + fmt(d_mp);
        document.getElementById('sum_lp').innerText = (d_lp >= 0 ? '+' : '') + fmt(d_lp);
        document.getElementById('sum_tot').innerText = (d_tot >= 0 ? '+' : '') + fmt(d_tot);
      } else {
        summaryBox.classList.add('hidden');
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">尚無紀錄。</td></tr>';
        return;
      }

      filtered.forEach(r => {
        const hp_d = r.hp_curr - r.hp_prev;
        const mp_d = r.mp_curr - r.mp_prev;
        const lp_d = r.lp_curr - r.lp_prev;
        const tot_curr = r.hp_curr + r.mp_curr + r.lp_curr;
        const tot_diff = hp_d + mp_d + lp_d;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="p-2 font-bold">${r.year}年${String(r.month).padStart(2,'0')}月</td>
          <td class="p-2 text-right font-mono">${fmt(r.hp_curr)} <span class="text-xs text-slate-500">(${hp_d>=0?'+':''}${fmt(hp_d)})</span></td>
          <td class="p-2 text-right font-mono">${fmt(r.mp_curr)} <span class="text-xs text-slate-500">(${mp_d>=0?'+':''}${fmt(mp_d)})</span></td>
          <td class="p-2 text-right font-mono">${fmt(r.lp_curr)} <span class="text-xs text-slate-500">(${lp_d>=0?'+':''}${fmt(lp_d)})</span></td>
          <td class="p-2 text-right font-mono font-bold text-blue-700">${fmt(tot_curr)} <span class="text-xs text-blue-500">(${tot_diff>=0?'+':''}${fmt(tot_diff)})</span></td>
          <td class="p-2 text-center">
            <button onclick='loadRecordToForm(${JSON.stringify(r)})' class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs mr-1">載入</button>
            <button onclick="deleteRecord(${r.year}, ${r.month})" class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 一鍵下載 Excel 專用 CSV 檔案
    function exportExcelCSV() {
      const records = getRecords();
      if (records.length === 0) return alert('目前沒有資料可下載！');

      const headers = ['年', '月', '高壓_上月累計', '高壓_本月累計', '高壓_本月敷設', '中壓_上月累計', '中壓_本月累計', '中壓_本月敷設', '低壓_上月累計', '低壓_本月累計', '低壓_本月敷設'];
      const rows = records.map(r => {
        const hp_d = (r.hp_curr - r.hp_prev).toFixed(2);
        const mp_d = (r.mp_curr - r.mp_prev).toFixed(2);
        const lp_d = (r.lp_curr - r.lp_prev).toFixed(2);
        return [
          r.year, r.month,
          r.hp_prev, r.hp_curr, hp_d,
          r.mp_prev, r.mp_curr, mp_d,
          r.lp_prev, r.lp_curr, lp_d
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `欣雄天然氣_管線敷設統計表_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(getRecords(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `欣雄管線備份_${new Date().toISOString().slice(0,10)}.json`; a.click();
    }

    function importJSON(e) {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          saveRecordsToStorage(JSON.parse(evt.target.result));
          updateYearFilterOptions(); renderHistory(); onDateChange();
          alert('✅ 備份還原成功！');
        } catch(err) { alert('❌ 格式錯誤'); }
      };
      reader.readAsText(f);
    }

    window.onload = function() { updateYearFilterOptions(); renderHistory(); onDateChange(); };
  </script>
</body>
</html>
